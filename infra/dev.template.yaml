AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dev-only runtime for the Simply360 Google Drive reference integration.

Parameters:
  PublicDomainName:
    Type: String
    Default: reference-drive.dev.simply360.app
    AllowedPattern: '^reference-drive\.dev\.simply360\.app$'
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$'
  HostedZoneId:
    Type: String
    AllowedPattern: '^Z[A-Z0-9]+$'
  GoogleSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:simply360/reference-drive/dev/google-[A-Za-z0-9/_+=.@-]+$'
  Simply360SecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:simply360/reference-drive/dev/simply360-[A-Za-z0-9/_+=.@-]+$'
  Simply360TransferOrigins:
    Type: String
    Description: Comma-separated exact HTTPS origins read from the published dev file API contract. No defaults are safe.
    AllowedPattern: '^https://[^, /?#]+(?::[0-9]+)?(?:,https://[^, /?#]+(?::[0-9]+)?)*$'

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        REFERENCE_ENVIRONMENT: dev
        PUBLIC_ORIGIN: !Sub https://${PublicDomainName}
        SIMPLY360_API_BASE_URL: https://api.dev.simply360.app
        SIMPLY360_TRANSFER_ORIGINS: !Ref Simply360TransferOrigins
        GOOGLE_OAUTH_SCOPE: https://www.googleapis.com/auth/drive.file
        GOOGLE_SECRET_ARN: !Ref GoogleSecretArn
        SIMPLY360_SECRET_ARN: !Ref Simply360SecretArn
        STATE_TABLE_NAME: !Ref StateTable
        IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTable
        AUTHORITY_TABLE_NAME: !Ref AuthorityTable
        OUTBOX_TABLE_NAME: !Ref OutboxTable
        WORK_QUEUE_URL: !Ref WorkQueue
        ENABLE_INSTALLATION_BOOTSTRAP: 'false'

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      FailOnWarnings: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","routeKey":"$context.routeKey","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      CodeUri: ../dist/
      Handler: lambda.handler
      ReservedConcurrentExecutions: 4
      Policies:
        - AWSXrayWriteOnlyAccess
        - Statement:
            - Sid: StateTables
              Effect: Allow
              Action:
                - dynamodb:DeleteItem
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt StateTable.Arn
                - !GetAtt IdempotencyTable.Arn
                - !GetAtt AuthorityTable.Arn
                - !GetAtt OutboxTable.Arn
                - !Sub ${OutboxTable.Arn}/index/StatusCreatedAtIndex
            - Sid: DispatchWork
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt WorkQueue.Arn
            - Sid: ReadExactSecrets
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref GoogleSecretArn
                - !Ref Simply360SecretArn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        OutboxRecovery:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-worker
      CodeUri: ../dist/
      Handler: lambda.handler
      ReservedConcurrentExecutions: 2
      Timeout: 900
      MemorySize: 1024
      Policies:
        - AWSXrayWriteOnlyAccess
        - Statement:
            - Sid: StateTables
              Effect: Allow
              Action:
                - dynamodb:DeleteItem
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt StateTable.Arn
                - !GetAtt IdempotencyTable.Arn
                - !GetAtt AuthorityTable.Arn
                - !GetAtt OutboxTable.Arn
                - !Sub ${OutboxTable.Arn}/index/StatusCreatedAtIndex
            - Sid: ConsumeWork
              Effect: Allow
              Action:
                - sqs:ChangeMessageVisibility
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ReceiveMessage
                - sqs:SendMessage
              Resource:
                - !GetAtt WorkQueue.Arn
                - !GetAtt DeadLetterQueue.Arn
            - Sid: ReadExactSecrets
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref GoogleSecretArn
                - !Ref Simply360SecretArn
      Events:
        Work:
          Type: SQS
          Properties:
            Queue: !GetAtt WorkQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 7
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-worker
      RetentionInDays: 7
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}
      RetentionInDays: 7

  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-idempotency
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expiresAtEpoch, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  AuthorityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-authority
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expiresAtEpoch, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  OutboxTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-outbox
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: status, AttributeType: S}
        - {AttributeName: createdAt, AttributeType: S}
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - {AttributeName: status, KeyType: HASH}
            - {AttributeName: createdAt, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}
      TimeToLiveSpecification: {AttributeName: expiresAtEpoch, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-work-dlq
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  WorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-work
      KmsMasterKeyId: alias/aws/sqs
      VisibilityTimeout: 5400
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref PublicDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomain
      Stage: '$default'
  ApiDns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref PublicDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomain.RegionalHostedZoneId

  DlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reference Drive DLQ contains work.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt DeadLetterQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  WorkAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Oldest queued reference Drive work is delayed.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt WorkQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reference Drive API Lambda is erroring.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reference Drive API Lambda is throttling.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reference Drive worker Lambda is erroring before partial batch handling.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref WorkerFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  WorkerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reference Drive worker Lambda is throttling.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref WorkerFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiOrigin:
    Value: !Sub https://${PublicDomainName}
  ApiFunctionArn:
    Value: !GetAtt ApiFunction.Arn
  WorkerFunctionArn:
    Value: !GetAtt WorkerFunction.Arn
  WorkQueueArn:
    Value: !GetAtt WorkQueue.Arn
